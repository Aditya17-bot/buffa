kind: Breaking changes
body: |-
    **A custom attribute string must be one or more `#[...]` attributes** (#711, closes #698). A string given to `type_attribute`, `field_attribute`, `message_attribute`, `enum_attribute`, `oneof_attribute` or `oneof_struct_field_attribute` was checked only for balanced delimiters and then written into the generated code. An empty string was accepted and added nothing, and a string such as `pub extra: u32,` given to `field_attribute` added a field to the generated struct. Both are now `CodeGenError::InvalidCustomAttribute`, which names the rule's path and the string, whether or not the path matches a generated item. So is `serde(skip)` without its brackets, which failed before with `CodeGenError::InvalidSyntax`. A build script that passes an empty string on one branch of a condition has to skip the call on that branch. A string that holds several attributes, or a `///` doc comment, is accepted as before.
time: 2026-10-13T23:40:00.000000000+00:00
